# Deployment workflow for Kasra Abedi's al-folio site. The source of truth is kasrabedi/kasra-al-folio.
name: Deploy Kasra Abedi website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v6

      - name: Checkout al-folio site
        uses: actions/checkout@v6
        with:
          repository: kasrabedi/kasra-al-folio
          path: site-source
          fetch-depth: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: site-source

      - name: Configure al-folio for the primary domain
        working-directory: site-source
        run: |
          sed -i 's#baseurl: "/kasra-al-folio"#baseurl: ""#' _config.yml
          grep -E '^(url|baseurl):' _config.yml

      - name: Build al-folio for the root domain
        working-directory: site-source
        run: bundle exec jekyll build --destination ../_site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
